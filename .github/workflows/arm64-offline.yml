name: Build ARM64 offline image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fork branch, tag, or commit to build
        default: security/redact-connection-passwords
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Configure Rust build
        run: |
          sed -i '/^FROM .* AS backend$/a ENV CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 CARGO_BUILD_JOBS=2' deploy/Dockerfile
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          tags: dbx:arm64-password-viewer
          load: true
          cache-from: type=gha,scope=offline-arm64
          cache-to: type=gha,scope=offline-arm64,mode=max,ignore-error=true
      - name: Export image
        shell: bash
        run: |
          test "$(docker image inspect dbx:arm64-password-viewer --format '{{.Os}}/{{.Architecture}}')" = linux/arm64
          docker save dbx:arm64-password-viewer | gzip -1 > dbx-arm64.tar.gz
          sha256sum dbx-arm64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dbx-arm64-offline
          path: |
            dbx-arm64.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
